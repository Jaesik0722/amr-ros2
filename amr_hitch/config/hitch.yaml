amr_hitch:
  ros__parameters:
    port: /dev/ttyDynamixel
    baudrate: 1000000
    # The ids are assumed, not read off the servos: the previous node addressed them by
    # BROADCAST_ID, so nothing here has ever seen the real ones. Scan the bus before the
    # first run.
    joint_names: [hitch_yaw_joint, hitch_pitch_joint]
    ids: [1, 2]
    zero_ticks: [2048, 2048]   # Raw position where each joint is at 0 rad.
    directions: [1, 1]
    lower_limits: [-1.5708, -1.5708]
    upper_limits: [1.5708, 1.5708]
    # 'position' or 'current_based_position' (compliant hitch, enables load estimation).
    operating_mode: position
    goal_current: 0
    profile_velocity: 0
    profile_acceleration: 0
    current_unit_mA: 2.69      # XM430/XM540. Check the e-Manual for other models.
    torque_on_start: true
    update_rate: 50.0
